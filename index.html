<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas de Estudio Personalizadas con IA</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Dependencias externas por CDN con versiones fijadas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="logo-container">
            <h1>📚 StudyPath AI</h1>
            <span class="badge">v1.0</span>
        </div>
        <nav class="main-nav">
            <button class="nav-btn active" data-view="generator">Crear Ruta</button>
            <button class="nav-btn" data-view="routes">Mis Rutas</button>
            <button class="nav-btn" data-view="progress">Progreso</button>
            <button class="nav-btn" data-view="settings">Ajustes</button>
        </nav>
        <div class="header-actions">
            <button id="theme-toggle" class="icon-btn" title="Cambiar tema">🌙</button>
        </div>
    </header>

    <main id="app-container">
        <!-- Las vistas se cargan dinámicamente aquí -->
        <div class="loading-screen">Cargando aplicación...</div>
    </main>

    <div id="modal-container" class="modal-overlay hidden"></div>
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
